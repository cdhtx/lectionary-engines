<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Lectionary Engines</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: var(--ivory-50); margin: 0; font-family: var(--font-ui); }
    .login-box { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 40px 48px; width: 100%; max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .login-logo { font-family: var(--font-editorial); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--ink-950); }
    .login-sub { font-family: var(--font-ui); font-size: 13px; color: #6c757d; text-align: center; margin-bottom: 32px; }
    .login-box label { font-family: var(--font-ui); display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
    .login-box input[type="email"],
    .login-box input[type="password"] { font-family: var(--font-ui); width: 100%; padding: 10px 14px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-size: 15px; box-sizing: border-box; transition: border-color 0.15s; }
    .login-box input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
    .field { margin-bottom: 20px; }
    .btn-login { font-family: var(--font-ui); width: 100%; padding: 11px; background: #2c5f8a; color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .btn-login:hover { background: #1e4a6d; }
    .error-msg { font-family: var(--font-ui); background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <p class="login-logo">Lectionary Engines</p>
    <p class="login-sub">Sign in to access your account</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Sign in →</button>
    </form>
  </div>
</body>
</html>
